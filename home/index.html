<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odyssée</title>
    <meta
      name="description"
      content="Maison Odyssée à Casablanca, Rabat et Tanger. Textiles, papiers peints, ambiances et sélection décorative."
    />
    <link rel="canonical" href="https://www.odyssee.ma/" />
    <link
      rel="icon"
      type="image/x-icon"
      href="/mirrored-assets/images-squarespace-cdn-com-677ec6234f6cb47c166aec02-ca529fb2-ea08-4095-ad9c-b15a09eab42f-favicon.ico?format=100w"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    <link rel="preload" as="image" href="/custom-assets/logo-odv-black.png" />
    <link rel="preload" as="image" href="/custom-assets/logo-odc-white-hq.png" />
    <link rel="stylesheet" href="/src/home-navbar.css" />
  </head>
  <body class="odc-home-shell homepage">
    <div id="odc-home-header-root"></div>
    <div id="siteWrapper">
      <main id="page" class="container" role="main">
        <section class="odc-home-hero-local" aria-label="Accueil Odyssée">
          <div class="odc-home-hero-local__media">
            <video class="odc-home-hero-video" autoplay muted loop playsinline preload="metadata">
              <source data-src="/custom-assets/odyssee-video-global-web.mp4" type="video/mp4" />
            </video>
          </div>
          <div class="odc-home-hero-local__overlay" aria-hidden="true"></div>
          <div class="odc-home-hero-local__card">
            <img src="/custom-assets/logo-odc-white-hq.png" alt="ODYSSEE" />
          </div>
          <button class="odc-home-hero-sound" type="button" aria-label="Activer le son" aria-pressed="false">
            <svg class="odc-home-hero-sound__icon odc-home-hero-sound__icon--muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5h4.2l4.3-3.5v12l-4.3-3.5H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M16 9.2l4.8 5.6M20.8 9.2 16 14.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <svg class="odc-home-hero-sound__icon odc-home-hero-sound__icon--unmuted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5h4.2l4.3-3.5v12l-4.3-3.5H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              <path d="M16.4 9a4.5 4.5 0 0 1 0 6M18.7 7a7.5 7.5 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </section>

        <section class="Marquee" aria-label="Marques partenaires"></section>
      </main>
      <footer id="footer-sections"></footer>
    </div>

    <script type="module" src="/src/home-navbar.js"></script>
  </body>
</html>
