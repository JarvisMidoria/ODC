<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mood Boards — Odyssée</title>
    <meta
      name="description"
      content="Explorez bientôt les mood boards Odyssée, pensés comme des compositions matière, couleur et atmosphère."
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/mirrored-assets/images-squarespace-cdn-com-677ec6234f6cb47c166aec02-ca529fb2-ea08-4095-ad9c-b15a09eab42f-favicon.ico?format=100w"
    />
    <link rel="stylesheet" href="/src/home-navbar.css" />
  </head>
  <body class="odc-home-shell odc-ambiances-page odc-mood-boards-page">
    <div id="odc-home-header-root"></div>
    <div id="siteWrapper">
      <main class="odc-ambiances-main">
        <section class="odc-ambiances-intro" aria-labelledby="odc-mood-boards-title">
          <div class="odc-ambiances-intro__inner">
            <h1 id="odc-mood-boards-title">Mood Boards</h1>
            <p>
              Une sélection de compositions matière, d’accords de couleurs et de directions créatives viendra enrichir
              cet espace très prochainement.
            </p>
          </div>
        </section>

        <section class="odc-ambiances-carousel" aria-label="Sélection Mood Boards à venir">
          <div class="odc-ambiances-carousel__inner">
            <div class="odc-ambiances-carousel__header">
              <p class="odc-ambiances-carousel__eyebrow">Sélection</p>
              <div class="odc-ambiances-carousel__controls">
                <button
                  class="odc-ambiances-carousel__control"
                  type="button"
                  aria-label="Slide précédente"
                  data-odc-ambiances-prev
                  disabled
                ></button>
                <button
                  class="odc-ambiances-carousel__control"
                  type="button"
                  aria-label="Slide suivante"
                  data-odc-ambiances-next
                  disabled
                ></button>
              </div>
            </div>

            <div class="odc-ambiances-carousel__viewport" data-odc-ambiances-carousel>
              <div class="odc-ambiances-carousel__track">
                <article class="odc-ambiances-slide">
                  <img src="/custom-assets/mood-boards/odyssee-14.jpg" alt="Mood board Odyssée 14" />
                </article>
                <article class="odc-ambiances-slide">
                  <img src="/custom-assets/mood-boards/odyssee-15.jpg" alt="Mood board Odyssée 15" />
                </article>
                <article class="odc-ambiances-slide">
                  <img src="/custom-assets/mood-boards/odyssee-16.jpg" alt="Mood board Odyssée 16" />
                </article>
                <article class="odc-ambiances-slide">
                  <img src="/custom-assets/mood-boards/odyssee-17.jpg" alt="Mood board Odyssée 17" />
                </article>
                <article class="odc-ambiances-slide">
                  <img src="/custom-assets/mood-boards/odyssee-18.jpg" alt="Mood board Odyssée 18" />
                </article>
                <article class="odc-ambiances-slide">
                  <img src="/custom-assets/mood-boards/odyssee-19.jpg" alt="Mood board Odyssée 19" />
                </article>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer id="footer-sections"></footer>
    </div>

    <script type="module" src="/src/home-navbar.js"></script>
  </body>
</html>
