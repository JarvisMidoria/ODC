<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Press Book — Odyssée</title>
    <meta
      name="description"
      content="Consultez bientôt le press book Odyssée, avec une sélection de publications et supports de présentation."
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="/mirrored-assets/images-squarespace-cdn-com-677ec6234f6cb47c166aec02-ca529fb2-ea08-4095-ad9c-b15a09eab42f-favicon.ico?format=100w"
    />
    <link rel="stylesheet" href="/src/home-navbar.css" />
  </head>
  <body class="odc-home-shell odc-ambiances-page">
    <div id="odc-home-header-root"></div>
    <div id="siteWrapper">
      <main class="odc-ambiances-main">
        <section class="odc-ambiances-intro" aria-labelledby="odc-press-book-title">
          <div class="odc-ambiances-intro__inner">
            <h1 id="odc-press-book-title">Press Book</h1>
            <p>
              Une sélection de publications, d’extraits presse et de documents de présentation Odyssée sera bientôt
              disponible dans cet espace.
            </p>
          </div>
        </section>

        <section class="odc-ambiances-carousel" aria-label="Sélection Press Book à venir">
          <div class="odc-ambiances-carousel__inner">
            <div class="odc-ambiances-carousel__header">
              <p class="odc-ambiances-carousel__eyebrow">Sélection</p>
              <div class="odc-ambiances-carousel__controls">
                <button class="odc-ambiances-carousel__control" type="button" aria-label="Slide précédente" disabled></button>
                <button class="odc-ambiances-carousel__control" type="button" aria-label="Slide suivante" disabled></button>
              </div>
            </div>

            <div class="odc-ambiances-carousel__viewport">
              <div class="odc-ambiances-carousel__track">
                <article class="odc-ambiances-slide odc-ambiances-slide--placeholder">
                  <div class="odc-ambiances-slide__placeholder">
                    <div class="odc-ambiances-slide__placeholder-inner">
                      <p class="odc-ambiances-slide__placeholder-kicker">À venir</p>
                      <h2 class="odc-ambiances-slide__placeholder-title">Press Book</h2>
                      <p class="odc-ambiances-slide__placeholder-copy">
                        Cette page accueillera prochainement une lecture claire des parutions, dossiers et supports
                        presse liés à l’univers Odyssée.
                      </p>
                    </div>
                  </div>
                </article>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer id="footer-sections"></footer>
    </div>

    <script type="module" src="/src/home-navbar.js"></script>
  </body>
</html>
